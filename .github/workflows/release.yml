name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  panel:
    name: admin panel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - working-directory: apps/admin-web
        run: npm ci
      - working-directory: apps/admin-web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-panel
          path: apps/admin-web/dist
          if-no-files-found: error

  server:
    name: server ${{ matrix.asset }}
    needs: [panel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build vardrop-server
        run: cargo build --release -p vardrop-server --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: admin-panel
          path: panel-dist
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          stage="dist/vardrop"
          mkdir -p "$stage/panel"
          bin="target/${TARGET}/release/vardrop-server"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            bin="${bin}.exe"
          fi
          cp "$bin" "$stage/"
          cp -a panel-dist/. "$stage/panel/"
          # İstemci kurulum dosyaları GitHub Releases'te ayrıdır (client job yükler).
          cp config.host.example.toml "$stage/config.toml"
          cp LICENSE deploy/HOST.txt "$stage/"
          name="vardrop-server-${ASSET}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            archive="dist/${name}.zip"
            # Git bash tar zip üretmez; Windows bsdtar üretir.
            /c/Windows/System32/tar.exe -a -cf "$archive" -C dist vardrop
          else
            archive="dist/${name}.tar.gz"
            tar -czf "$archive" -C dist vardrop
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vardrop-server-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  client:
    name: client ${{ matrix.id }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            id: macos-arm64
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            id: macos-x64
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            id: linux-x64
            args: ""
          - platform: ubuntu-22.04-arm
            id: linux-arm64
            args: ""
          - platform: windows-latest
            id: windows-x64
            args: ""
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
      - name: Install Tauri CLI
        working-directory: apps/client
        run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/client
          tagName: ${{ github.ref_name }}
          releaseName: Vardrop ${{ github.ref_name }}
          releaseBody: |
            Sunucu: `vardrop-server-*` arşivi veya ghcr imajı — kurulum: `docs/SELF-HOST.md`.
            İstemci: platform paketini kurun, sonra Tokenlar sayfasından read PAT üretip exe'ye girin.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadPlainBinary: true
          generateReleaseNotes: true
          retryAttempts: 3
          args: ${{ matrix.args }}

  docker:
    name: ghcr image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
