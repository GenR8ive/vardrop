[package]
name = "vardrop"
version = "0.1.0"
edition = "2021"
description = "Vardrop istemcisi — Ctrl+Alt+V ile açılan değişken arama/kopyalama penceresi"
license = "MIT"

# Tauri uygulaması cargo workspace'ten yalıtıldı.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
