[package]
name = "vardrop"
version = "0.2.2"
edition = "2021"
description = "Vardrop istemcisi — Ctrl+Alt+V ile açılan değişken arama/kopyalama penceresi"
license = "MIT"

# Tauri uygulaması cargo workspace'ten yalıtıldı.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
base64 = "0.22"
# Görsel entry'leri panoya resim olarak koymak için decode.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }

[target.'cfg(windows)'.dependencies]
# Odak hedef pencereye geri verilip Ctrl+V gönderilir (paste-after-focus).
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
