[workspace]
resolver = "2"
members = ["crates/vardrop-core", "crates/vardrop-server"]
exclude = ["apps/client/src-tauri"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "Self-hosted variable and secret registry"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
base64 = "0.22"
